services:
  web:
    build: .
    command: gunicorn hubspot_project.wsgi:application --bind 0.0.0.0:5202 --workers 4 --timeout 120
    ports:
      - "5202:5202"
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME:-hubspot_deals_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hubspot_deals_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
